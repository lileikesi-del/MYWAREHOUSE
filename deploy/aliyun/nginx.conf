# Nginx reverse proxy for the Christmas cards app.
# Copy to /etc/nginx/sites-available/christmas-cards, replace cards.example.com,
# then:
#   ln -s /etc/nginx/sites-available/christmas-cards /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d cards.example.com
# certbot rewrites this file to add the 443 block and the http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name cards.example.com;

    # Audio uploads go through this proxy: the app caps them well below this.
    client_max_body_size 32m;

    # Next.js serves hashed assets; let the browser keep them.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
